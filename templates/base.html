{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CampusCore{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'registrations:register' %}">CampusCore</a>
    {% if request.user.is_authenticated %}
      <nav><a href="{% url 'students:dashboard' %}">Dashboard</a><form class="inline-form" method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit" class="link-button">Log out</button></form></nav>
    {% else %}
      <nav><a href="{% url 'login' %}">Owner login</a></nav>
    {% endif %}
  </header>
  <main class="container">
    {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
